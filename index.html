<title>CS2 Subtick & GPU Starvation Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Oxanium', 'Barlow', 'system-ui', 'sans-serif'],
          body: ['Barlow', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
        },
        colors: {
          void: '#09090B', panel: '#0E0E12', raised: '#15151B', edge: '#24242D',
          ink: '#F4F4F5', dim: '#8E8E9A', frame: '#EF4444', wait: '#F59E0B',
          busy: '#06B6D4', tick: '#A78BFA', ok: '#34F5A0',
        },
      },
    },
  };
</script>
<style>
  :root {
    --bg: #09090B; --panel: #0E0E12; --edge: #24242D; --ink: #F4F4F5; --dim: #8E8E9A;
    --ok: #34F5A0; --tick: #A78BFA;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  /* The tool is OLED-dark by design; tokens are restated for both schemes on purpose. */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #09090B; --ink: #F4F4F5; } }
  :root[data-theme="dark"] { --bg: #09090B; --ink: #F4F4F5; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Barlow, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; font-family: Oxanium, Barlow, system-ui, sans-serif; }
  :focus-visible { outline: 2px solid var(--tick); outline-offset: 2px; border-radius: 6px; }
  img, svg { max-width: 100%; }

  .glow-ok { color: var(--ok); text-shadow: 0 0 18px rgba(52,245,160,.55), 0 0 2px rgba(52,245,160,.9); }
  .grid-bg {
    background-image:
      linear-gradient(rgba(167,139,250,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  /* Metronome strip: one tick lights per 15.625 ms cadence, slowed 64x so the eye can follow it */
  .metro span { display:block; width:100%; height:100%; border-radius:2px; background:#1c1c24; }
  .metro.on span { animation: beat 1s steps(1) infinite; }
  @keyframes beat { 0% { background: var(--ok); box-shadow: 0 0 10px var(--ok);} 12% { background:#1c1c24; box-shadow:none; } }
  @media (prefers-reduced-motion: reduce) { .metro.on span { animation: none; background: rgba(52,245,160,.45); } }

  /* Dual-thumb range */
  .dual { position: relative; height: 28px; }
  .dual input[type=range] { position:absolute; inset:0; width:100%; pointer-events:none; -webkit-appearance:none; appearance:none; background:transparent; margin:0; }
  .dual input[type=range]::-webkit-slider-thumb { pointer-events:auto; -webkit-appearance:none; width:16px; height:22px; border-radius:4px; background:#F4F4F5; border:2px solid var(--tick); cursor:ew-resize; }
  .dual input[type=range]::-moz-range-thumb { pointer-events:auto; width:14px; height:20px; border-radius:4px; background:#F4F4F5; border:2px solid var(--tick); cursor:ew-resize; }
  .dual input[type=range]::-webkit-slider-runnable-track { background: transparent; }
  .scroll-x { overflow-x: auto; }
  .recharts-tooltip-wrapper { z-index: 20; }
</style>
</head>

<!-- ============================ ANALYSIS ENGINE ============================ -->
<script id="engine">
(function (root) {
  const TICK_MS = 1000 / 64; // 15.625
  const BAND = [14.1, 17.1];        // global detector band (±1.5 ms)
  const WIN_BAND = [14.2, 16.9];    // strict band for window scoring

  const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN;
  const std = (a, m = mean(a)) => a.length > 1 ? Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)) : 0;
  const median = a => { if (!a.length) return NaN; const s = Float64Array.from(a).sort(); const h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
  const mad = (a, m = median(a)) => median(a.map(v => Math.abs(v - m)));
  const pearson = (x, y) => {
    const mx = mean(x), my = mean(y); let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < x.length; i++) { const dx = x[i] - mx, dy = y[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
    return sxx && syy ? sxy / Math.sqrt(sxx * syy) : 0;
  };
  const isLocalMax = (v, i) => i > 0 && i < v.length - 1 && v[i] >= v[i - 1] && v[i] > v[i + 1];

  // ---------- Column mapping ----------
  const ALIASES = {
    t: ['TimeInSeconds', 'CPUStartTime', 'TimeInMs', 'Time'],
    ft: ['MsBetweenPresents', 'FrameTime', 'MsBetweenAppStart', 'MsBetweenDisplayChange'],
    gb: ['MsGPUBusy', 'GPUBusy', 'MsGPUActive', 'GPUTime'],
    gw: ['MsGPUWait', 'GPUWait'],
    cb: ['MsCPUBusy', 'CPUBusy'],
    cu: ['CPUUtilization', 'CPU Utilization'],
    gu: ['GPUUtilization', 'GPU Utilization'],
    cf: ['CPUFrequency', 'CPU Frequency'],
    gf: ['GPUFrequency'],
    gt: ['GPUTemperature'],
    gm: ['GPUMemUsed', 'GPUMemSizeUsed', 'GPUMemoryUsed'],
    gms: ['GPUMemSize', 'GPUMemoryTotal'],
    app: ['Application'],
  };
  function mapColumns(fields) {
    const lower = new Map(fields.map(f => [String(f).trim().toLowerCase(), f]));
    const out = {};
    for (const [k, names] of Object.entries(ALIASES)) {
      for (const n of names) { const hit = lower.get(n.toLowerCase()); if (hit !== undefined) { out[k] = hit; break; } }
    }
    return out;
  }
  const num = v => { if (typeof v === 'number') return v; if (v == null || v === '' || v === 'NA') return NaN; const n = parseFloat(v); return n; };

  // Normalise raw row objects into frames {t(s), ft, gw, gb, cb, cu, gu, cf}
  function buildFrames(rows, cols) {
    if (!cols.ft) throw new Error('No MsBetweenPresents (or FrameTime) column found. Export a PresentMon CSV capture of cs2.exe.');
    const frames = []; let derivedWait = false;
    for (const r of rows) {
      const ft = num(r[cols.ft]);
      if (!(ft > 0) || ft > 5000) continue;
      const gb = cols.gb ? num(r[cols.gb]) : NaN;
      let gw = cols.gw ? num(r[cols.gw]) : NaN;
      if (!isFinite(gw) && isFinite(gb)) { gw = Math.max(0, ft - gb); derivedWait = true; }
      frames.push({
        traw: cols.t ? num(r[cols.t]) : NaN, ft, gb, gw,
        cb: cols.cb ? num(r[cols.cb]) : NaN,
        cu: cols.cu ? num(r[cols.cu]) : NaN, gu: cols.gu ? num(r[cols.gu]) : NaN,
        cf: cols.cf ? num(r[cols.cf]) : NaN, gf: cols.gf ? num(r[cols.gf]) : NaN,
        gt: cols.gt ? num(r[cols.gt]) : NaN, gm: cols.gm ? num(r[cols.gm]) : NaN, gms: cols.gms ? num(r[cols.gms]) : NaN,
      });
    }
    if (frames.length < 50) throw new Error('Fewer than 50 valid frames were found in this file.');
    // Resolve time base: seconds, milliseconds, or cumulative frametime
    const hasT = frames.filter(f => isFinite(f.traw)).length > frames.length * 0.9;
    let timeSource = 'cumulative MsBetweenPresents';
    if (hasT) {
      frames.sort((a, b) => a.traw - b.traw);
      const dts = []; for (let i = 1; i < Math.min(frames.length, 5000); i++) dts.push(frames[i].traw - frames[i - 1].traw);
      const mdt = median(dts), mft = median(frames.map(f => f.ft));
      const scale = Math.abs(Math.log(mdt * 1000 / mft)) < Math.abs(Math.log(mdt / mft)) ? 1 : 0.001;
      const t0 = frames[0].traw;
      frames.forEach(f => { f.t = (f.traw - t0) * scale; });
      timeSource = (cols.t || 'time') + (scale === 1 ? ' (s)' : ' (ms → s)');
    } else {
      let acc = 0; frames.forEach(f => { f.t = acc / 1000; acc += f.ft; });
    }
    frames.forEach((f, i) => { f.i = i; f.tm = f.t * 1000; delete f.traw; });
    return { frames, derivedWait, timeSource, hasGpu: frames.some(f => isFinite(f.gb)) };
  }

  // ---------- Global 64 Hz detector ----------
  function detectTicks(frames) {
    const ft = frames.map(f => f.ft);
    const gw = frames.map(f => (isFinite(f.gw) ? f.gw : 0));
    const medFt = median(ft), medGw = median(gw), madGw = mad(gw, medGw);
    const ftThr = Math.max(3.8, 1.4 * medFt);
    const gwThr = Math.max(1.4 * medGw, medGw + 3 * 1.4826 * madGw, 0.5);

    const cand = [];
    for (let i = 1; i < frames.length - 1; i++) {
      if ((ft[i] > ftThr && isLocalMax(ft, i)) || (gw[i] > gwThr && isLocalMax(gw, i))) cand.push(i);
    }
    // Merge candidates within 3 ms (a stall can straddle two presents); keep the tallest frametime
    const events = [];
    for (const i of cand) {
      const last = events[events.length - 1];
      if (last && frames[i].tm - frames[last.start].tm <= 3) { if (ft[i] > ft[last.i]) last.i = i; }
      else events.push({ i, start: i });
    }
    const ev = events.map(e => ({ i: e.i, tm: frames[e.i].tm }));
    const intervals = [];
    for (let k = 1; k < ev.length; k++) intervals.push(ev[k].tm - ev[k - 1].tm);
    const inBand = d => d >= BAND[0] && d <= BAND[1];
    const matched = intervals.filter(inBand);
    const pct = intervals.length ? matched.length / intervals.length : 0;
    const harmonic = intervals.filter(d => !inBand(d) && [2, 3, 4].some(h => Math.abs(d - h * TICK_MS) <= 1.5)).length;

    // Tick-aligned events: either neighbour interval is in the band
    const tickSet = new Set();
    for (let k = 1; k < ev.length; k++) if (inBand(ev[k].tm - ev[k - 1].tm)) { tickSet.add(k - 1); tickSet.add(k); }
    const ticks = [...tickSet].sort((a, b) => a - b).map(k => ev[k]);

    // Phase-locking test (Rayleigh periodogram over 15.3–16.0 ms, Bonferroni-corrected)
    const n = ev.length; let best = { P: TICK_MS, R: 0, Z: 0 };
    if (n >= 8) {
      for (let P = 15.3; P <= 16.0001; P += 0.005) {
        let C = 0, S = 0; const w = 2 * Math.PI / P;
        for (const e of ev) { C += Math.cos(w * e.tm); S += Math.sin(w * e.tm); }
        const Rn = Math.hypot(C, S);
        if (Rn > best.R) best = { P, R: Rn, Z: Rn * Rn / n };
      }
    }
    const Rn = best.R;
    let pSingle = n >= 8 ? Math.exp(Math.sqrt(1 + 4 * n + 4 * (n * n - Rn * Rn)) - (1 + 2 * n)) : 1;
    const durMs = frames[frames.length - 1].tm - frames[0].tm;
    const nIndep = Math.max(1, durMs * (1 / 15.3 - 1 / 16.0));
    const pValue = Math.min(1, pSingle * nIndep);

    const meanInterval = matched.length ? mean(matched) : NaN;
    const confirmed = intervals.length >= 5 && pct >= 0.35;
    return {
      ftThr, gwThr, medFt, medGw, events: ev, intervals, matchedCount: matched.length, pct, harmonic,
      ticks, meanInterval, rhythmHz: 1000 / meanInterval, confirmed,
      phase: { period: best.P, rbar: n ? Rn / n : 0, n, pValue },
    };
  }

  // ---------- "Best evidence" sliding window ----------
  function bestWindow(frames, winMs = 350, stepMs = 50) {
    const t0 = frames[0].tm, tEnd = frames[frames.length - 1].tm;
    let lo = 0, hi = 0, best = null; const all = [];
    for (let ws = t0; ws + winMs <= tEnd + 1e-6; ws += stepMs) {
      const we = ws + winMs;
      while (lo < frames.length && frames[lo].tm < ws) lo++;
      while (hi < frames.length && frames[hi].tm < we) hi++;
      if (hi - lo < 10) continue;
      const gw = [], gb = [];
      for (let i = lo; i < hi; i++) { gw.push(isFinite(frames[i].gw) ? frames[i].gw : 0); if (isFinite(frames[i].gb)) gb.push(frames[i].gb); }
      const m = mean(gw), s = std(gw, m), thr = m + 1.2 * s;
      const peaks = [];
      for (let k = 1; k < gw.length - 1; k++) if (gw[k] > thr && isLocalMax(gw, k)) peaks.push(k);
      let aligned = 0; const heights = [];
      for (let p = 1; p < peaks.length; p++) {
        const d = frames[lo + peaks[p]].tm - frames[lo + peaks[p - 1]].tm;
        if (d >= WIN_BAND[0] && d <= WIN_BAND[1]) aligned++;
      }
      for (const k of peaks) heights.push(gw[k]);
      const sdBusy = Math.max(std(gb), 0.05);
      const score = aligned >= 2 ? aligned * mean(heights) / sdBusy : 0;
      all.push(score);
      if (!best || score > best.score) best = { score, start: ws / 1000, end: we / 1000, aligned, peaks: peaks.length, avgPeak: mean(heights), sdBusy };
    }
    return best && best.score > 0 ? best : null;
  }

  // ---------- Summary metrics ----------
  function summarise(frames, det) {
    const near = new Uint8Array(frames.length);
    det.events.forEach(e => { for (let d = -1; d <= 1; d++) if (frames[e.i + d]) near[e.i + d] = 1; });
    const tickFrames = det.ticks.map(e => frames[e.i]);
    const base = frames.filter((f, i) => !near[i]);
    const gwTick = mean(tickFrames.map(f => f.gw).filter(isFinite));
    const gwBase = mean(base.map(f => f.gw).filter(isFinite));
    const gbAll = frames.map(f => f.gb).filter(isFinite);
    const gbTick = mean(tickFrames.map(f => f.gb).filter(isFinite));
    const ftAll = frames.map(f => f.ft);
    const pick = k => frames.map(f => f[k]).filter(isFinite);
    const paired = frames.filter(f => isFinite(f.gb) && isFinite(f.gw));
    const avg = k => { const a = pick(k); return a.length ? mean(a) : NaN; };
    const maxTickFt = tickFrames.length ? Math.max(...tickFrames.map(f => f.ft)) : NaN;
    return {
      frames: frames.length,
      duration: frames[frames.length - 1].t - frames[0].t,
      avgFps: 1000 / mean(ftAll),

      gwTick, gwBase, surgePct: (gwTick / gwBase - 1) * 100,
      gbAvg: mean(gbAll), gbTick, gbBaseline: mean(base.map(f => f.gb).filter(isFinite)),
      gpuPotentialFps: 1000 / mean(gbAll),
      tickFps: 1000 / maxTickFt, maxTickFt,
      rFtGw: paired.length ? pearson(paired.map(f => f.ft), paired.map(f => f.gw)) : NaN,
      rFtGb: paired.length ? pearson(paired.map(f => f.ft), paired.map(f => f.gb)) : NaN,
      cpu: avg('cu'), gpu: avg('gu'), cpuMHz: avg('cf'), gpuMHz: avg('gf'), gpuTemp: avg('gt'),

  }

  // ---------- Synthetic demo capture ----------
  function makeDemoRows(seconds = 24) {
    let s = 1337; const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
    const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    const rows = []; let t = 0; let nextTick = 4.1; const end = seconds * 1000;
    while (t < end) {
      const sec = t / 1000;
      // Engagement intensity: quiet spawn, mid-round, a heavy firefight around 15.2–16.4 s
      let intensity = sec < 2 ? 0.25 : sec < 9 ? 0.75 : sec < 15.2 ? 0.55 : sec < 16.4 ? 1.25 : 0.7;
      let gb = 1.82 + gauss() * 0.06;
      let gw = 0.32 + Math.abs(gauss()) * 0.12;
      let cb = 2.05 + gauss() * 0.1;

        if (rnd() < 0.55 + 0.4 * Math.min(1, intensity)) {
          const spike = (2.4 + rnd() * 2.2) * intensity + 0.9;
          gw += spike; cb += spike * 0.95;
        }
        nextTick += 15.625 + gauss() * 0.12;
      }
      if (rnd() < 0.0015) { const h = 4 + rnd() * 6; gw += h; cb += h; } // unrelated hitch
      const ft = Math.max(gb + gw + 0.05 + gauss() * 0.03, gb + 0.1);
      rows.push({
        Application: 'cs2.exe',
        TimeInSeconds: +(t / 1000).toFixed(6),
        MsBetweenPresents: +ft.toFixed(4), MsGPUBusy: +gb.toFixed(4), MsGPUWait: +gw.toFixed(4), MsCPUBusy: +cb.toFixed(4),
        CPUUtilization: +(34 + gauss() * 3 + intensity * 6).toFixed(2),
        GPUUtilization: +(71 + gauss() * 3 - intensity * 5).toFixed(2),
        CPUFrequency: Math.round(5480 + gauss() * 40), GPUFrequency: Math.round(2745 + gauss() * 15),
        GPUTemperature: +(63 + gauss() * 0.5).toFixed(1),
        GPUMemUsed: Math.round(5.1e9 + gauss() * 2e7), GPUMemSize: 16e9,
      });
      t += ft;
    }
    return rows;
  }

  root.Engine = { TICK_MS, BAND, WIN_BAND, mapColumns, buildFrames, detectTicks, bestWindow, summarise, makeDemoRows, mean, median };

  const niceStep = (span, target) => {

  function DiagnosticShareCard({ svgRef, frames, det, sum, win, hwLabel, userTag, creator }) {

    const ticks = useMemo(() => det.ticks.filter(e => e.tm / 1000 >= a && e.tm / 1000 <= b).slice(0, 400), [det, a, b]);

    const sx = t => X0 + (t - a) / Math.max(1e-9, b - a) * (X1 - X0);

    const pathOf = k => view.filter(fr => isFinite(fr[k])).map((fr, i) => (i ? 'L' : 'M') + sx(fr.t).toFixed(1) + ' ' + sy(fr[k]).toFixed(1)).join('');
    const spanMs = (b - a) * 1000, xStep = niceStep(spanMs, 8);
    const xTicks = []; for (let v = 0; v <= spanMs + 1e-6; v += xStep) xTicks.push(v);

    const wmSize = Math.min(104, 104 * (X1 - X0) * 0.9 / measure('ox800', 104, 'VALVE 64HZ TICK BOUNDARY DESYNC', 8));

      { id: 'starvation', color: C.gw, label: 'GPU Starvation', value: isFinite(sum.surgePct) ? (sum.surgePct >= 0 ? '+' : '') + fint(sum.surgePct) + '%' : '—', unit: 'GPU Wait at Tick', sub: `${fx(sum.gwTick, 2)} ms at tick vs ${fx(sum.gwBase, 2)} ms baseline` },

      { id: 'tickfps', color: C.ft, label: 'Bottlenecked Tick FPS', value: fint(sum.tickFps), unit: 'FPS', sub: `1000 / worst tick frametime (${fx(sum.maxTickFt, 2)} ms)` },
    ];

    // Footer geometry
    const leftText = creator.left;
    const leftSize = 20, leftW = Math.max(measure('jb700', leftSize, leftText), userTag ? measure('bar500', 19, 'Co-signed by ' + userTag) : 0);
    const rightSize = 36, rightW = measure('ox800', rightSize, creator.hashtag);
    const urlFit = fitText('jb700', 19, creator.url, (W - M - rightW - 48) - (M + leftW + 48), 13);
    const centerX = ((M + leftW) + (W - M - rightW)) / 2;

    const check = (x, y, s, color) => html`<path d=${`M${x + s * 0.2} ${y + s * 0.52} L${x + s * 0.42} ${y + s * 0.74} L${x + s * 0.82} ${y + s * 0.28}`} fill="none" stroke=${color} strokeWidth=${s * 0.14} strokeLinecap="round" strokeLinejoin="round" />`;

    return html`

          </g>

            <rect x=${badgeX} y="68" width=${badgeW} height="64" rx="10" fill="none" stroke=${badgeColor} strokeWidth="3" filter="url(#softglow)" opacity="0.9" />

  // ---------- Export pipeline ----------
  function outlineText(svg) {
    const NS = 'http://www.w3.org/2000/svg';
    svg.querySelectorAll('text').forEach((t, n) => {
      const f = t.getAttribute('data-f'), font = FONTS[f];
      const str = t.textContent;
      if (!font || !str.trim()) { t.remove(); return; }
      const size = +t.getAttribute('data-size'), ls = +t.getAttribute('data-ls') || 0;
      const x = +t.getAttribute('x'), y = +t.getAttribute('y');

      p.setAttribute('id', t.getAttribute('id') || ('text-' + n));

  function buildSvgString(svgEl, { outline }) {
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

    else {
      const st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      st.textContent = FONT_CSS;
      clone.querySelector('defs').prepend(st);
      clone.querySelectorAll('text').forEach(t => { t.removeAttribute('style'); t.removeAttribute('data-f'); t.removeAttribute('data-size'); t.removeAttribute('data-ls'); });
    }

  }

  async function rasterize(svgEl, scale) {
    const str = buildSvgString(svgEl, { outline: true });
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
    await img.decode();
    const cv = document.createElement('canvas');
    cv.width = W * scale; cv.height = H * scale;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    return new Promise((res, rej) => cv.toBlob(bl => bl ? res(bl) : rej(new Error('PNG encoding failed')), 'image/png'));
  }

  async function saveFile(filename, data) {
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (_) {}
    if (dl) {
      try { await dl.save({ filename, data }); return 'saved'; }
      catch (e) { return e && e.code === 'declined' ? 'declined' : 'unavailable'; }
    }

    const url = URL.createObjectURL(blob); const aEl = document.createElement('a');
    aEl.href = url; aEl.download = filename; document.body.appendChild(aEl); aEl.click(); aEl.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return 'saved';
  }

  const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };

    left: 'YouTube: @STEEZYYX | STEAM: 1337shameless',
    url: 'https://1337Shameless.github.io/cs2-frametimes-analyzer/',

  function Segmented({ value, onChange, options, label }) {

      const cpu = [isFinite(sum.cpuMHz) ? fint(sum.cpuMHz) + ' MHz' : '', isFinite(sum.cpu) ? fx(sum.cpu, 0) + '% load' : ''].filter(Boolean).join(' · ');
      const gpu = [isFinite(sum.gpuMHz) ? fint(sum.gpuMHz) + ' MHz' : '', isFinite(sum.gpu) ? fx(sum.gpu, 0) + '% load' : ''].filter(Boolean).join(' · ');
      return [gpu && 'GPU: ' + gpu, cpu && 'CPU: ' + cpu].filter(Boolean).join(' | ') || 'GPU: — | CPU: —';
    }, [sum]);
    const [hw, setHw] = useState(defaultHw);

    const [tag, setTag] = useState('');

    useEffect(() => {

    const download = async () => {
      if (!svgRef.current) return;
      setBusy('download');
      try {
        let r;
        if (fmt === 'png') r = await saveFile(base + '.png', await rasterize(svgRef.current, res));
        else r = await saveFile(base + '.svg', buildSvgString(svgRef.current, { outline }));

    const copy = async () => {

    const field = 'w-full h-10 rounded-md border border-edge bg-void px-3 text-sm text-ink placeholder:text-dim/70';

                    <input type="checkbox" className="mt-1 accent-violet-400" checked=${outline} disabled=${!canOutline()} onChange=${e => setOutline(e.target.checked)} />
                    <span><span className="block text-sm font-semibold">Convert text to outlines</span>
                    <span className="block text-[11px] text-dim mt-0.5">Every glyph becomes a vector path, so the card looks identical in Illustrator, After Effects, Figma or Fusion. Turn off to keep live, editable text with the fonts embedded.</span></span>
                  </label>`}
              <label className="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" className="accent-violet-400" checked=${useTag} onChange=${e => setUseTag(e.target.checked)} />
                <span className="text-sm font-semibold">Add my own GamerTag/Social</span>
              </label>
              ${useTag && html`<input className=${field} value=${tag} maxLength=${40} autoFocus onChange=${e => setTag(e.target.value)} placeholder="e.g. twitch.tv/yourname" aria-label="Your GamerTag or social handle" />`}
            </div>

            <div className="flex flex-col gap-3 md:justify-end">

                ${Icon(busy === 'download' ? 'LoaderCircle' : 'Download', { size: 18, className: busy === 'download' ? 'animate-spin' : '' })}
                Download Card (${fmt === 'png' ? (res === 2 ? 'PNG 4K' : 'PNG 1080p') : 'SVG'})
              </button>
              <button type="button" onClick=${copy} disabled=${!!busy}
                className="inline-flex items-center justify-center gap-2 h-11 rounded-lg border border-edge bg-void font-semibold hover:border-dim disabled:opacity-50">
                ${Icon(busy === 'copy' ? 'LoaderCircle' : 'Copy', { size: 17, className: busy === 'copy' ? 'animate-spin' : '' })} Copy PNG to Clipboard
              </button>
              <p className="text-[11px] text-dim break-all num">${base}.${fmt}</p>
            </div>
          </div>
        </div>
      </div>`;
  }

  window.ShareCardKit = { ShareModal, DiagnosticShareCard, buildSvgString, rasterize, saveFile };
})();

</script>

<!-- ============================ UI ============================ -->
<script>
(function () {
  const { useState, useMemo, useRef, useEffect, useCallback } = React;
  const html = htm.bind(React.createElement);
  const RC = window.Recharts;
  const { ResponsiveContainer, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ReferenceLine, ReferenceArea, BarChart, Bar, Cell } = RC;
  const L = window.LucideReact || {};
  const Icon = (name, props = {}) => L[name] ? React.createElement(L[name], { size: 16, strokeWidth: 2, ...props }) : null;
  const E = window.Engine;

  const COLORS = { ft: '#EF4444', gw: '#F59E0B', gb: '#06B6D4', tick: '#A78BFA', ok: '#34F5A0' };
  const f1 = v => isFinite(v) ? v.toFixed(1) : '—';
  const f2 = v => isFinite(v) ? v.toFixed(2) : '—';
  const f0 = v => isFinite(v) ? Math.round(v).toLocaleString() : '—';
  const fp = p => p < 0.001 ? 'p < 0.001' : 'p = ' + p.toFixed(3);

  // ---------- small primitives ----------
  const Btn = ({ onClick, children, variant = 'ghost', disabled, title }) => {
    const base = 'inline-flex items-center gap-2 rounded-md px-3 h-9 text-sm font-semibold transition-colors disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap';
    const v = {
      primary: 'bg-ink text-void hover:bg-white',
      ghost: 'border border-edge bg-panel text-ink hover:border-dim',
    }[variant];
    return html`<button type="button" title=${title} disabled=${disabled} onClick=${onClick} className=${base + ' ' + v}>${children}</button>`;
  };

  // ---------- Drop zone ----------
  function DropZone({ onFile, onDemo, busy, error }) {
    const [over, setOver] = useState(false);
    const inputRef = useRef(null);
    return html`
      <section className="mx-auto max-w-5xl px-5 pt-10 pb-16">
        <div className="grid gap-10 md:grid-cols-[1.1fr_1fr] items-start">
          <div>
            <h1 className="font-display text-4xl sm:text-5xl font-bold leading-[1.05] tracking-tight">
              Is your GPU waiting on the 64 Hz tick?
            </h1>
            <p className="mt-5 text-lg text-dim max-w-[60ch] leading-relaxed">
              Drop a PresentMon capture of cs2.exe. The tool finds frametime spikes, measures how often they land
              15.6 ms apart, and shows whether the GPU was busy or simply starved when they happened.
            </p>
            <p className="mt-4 text-sm text-dim max-w-[60ch]">
              Everything runs in this browser tab. Your CSV is never uploaded.
            </p>
            <div className="mt-8 flex flex-wrap gap-3">
              <${Btn} variant="primary" onClick=${() => inputRef.current && inputRef.current.click()}>${Icon('FolderOpen')} Choose CSV<//>

            </div>
          </div>
          <label
            onDragOver=${e => { e.preventDefault(); setOver(true); }}
            onDragLeave=${() => setOver(false)}
            onDrop=${e => { e.preventDefault(); setOver(false); const f = e.dataTransfer.files[0]; if (f) onFile(f); }}
            className=${'grid-bg relative flex min-h-[260px] cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed p-8 text-center transition-colors ' + (over ? 'border-tick bg-tick/10' : 'border-edge bg-panel hover:border-dim')}>
            <input ref=${inputRef} type="file" accept=".csv,text/csv" className="sr-only" onChange=${e => { const f = e.target.files[0]; if (f) onFile(f); e.target.value = ''; }} />
            <div className="text-tick">${Icon('FileUp', { size: 36, strokeWidth: 1.5 })}</div>
            <p className="mt-4 font-display text-lg font-semibold">${busy ? 'Parsing capture…' : 'Drop pmcap-cs2.exe-*.csv here'}</p>
            <p className="mt-2 text-sm text-dim">or click to browse</p>
            <p className="mt-6 text-xs text-dim leading-relaxed max-w-[42ch]">
              Reads TimeInSeconds, MsBetweenPresents, MsGPUBusy, MsGPUWait, MsCPUBusy and the CPU/GPU telemetry columns.
              PresentMon 2 names (FrameTime, GPUBusy, GPUWait) work too.
            </p>
          </label>
        </div>
        ${error && html`<div role="alert" className="mt-8 rounded-lg border border-frame/50 bg-frame/10 px-4 py-3 text-sm flex gap-3 items-start">
          <span className="text-frame mt-0.5">${Icon('TriangleAlert')}</span><span>${error}</span></div>`}
      </section>`;
  }

  // ---------- Verdict banner ----------
  function Verdict({ det }) {
    const ok = det.confirmed;
    return html`
      <section className=${'rounded-xl border p-5 sm:p-6 ' + (ok ? 'border-ok/40 bg-ok/[0.04]' : 'border-wait/40 bg-wait/[0.04]')}>
        <div className="flex flex-col lg:flex-row lg:items-center gap-5 lg:gap-10">
          <div className="flex-1 min-w-0">
            ${ok
              ? html`<p className="font-display text-xl sm:text-2xl font-bold glow-ok">[✔] 64 Hz TICK ALIGNMENT CONFIRMED (${fp(det.phase.pValue)})</p>`
              : html`<p className="font-display text-xl sm:text-2xl font-bold text-wait">[!] Asynchronous / Jittery Tick Pattern</p>`}
            <p className="mt-2 text-dim num">
              ${isFinite(det.meanInterval)
                ? `Mean Tick Interval: ${f2(det.meanInterval)} ms | Rhythm: ${f1(det.rhythmHz)} Hz`
                : 'No spike intervals landed in the 14.1–17.1 ms band.'}
            </p>
            <p className="mt-1 text-sm text-dim num">
              ${det.matchedCount} of ${det.intervals.length} spike intervals (${f1(det.pct * 100)}%) fall within 15.625 ± 1.5 ms · threshold 35%.
              Phase-lock ${f2(det.phase.rbar)} at ${f2(det.phase.period)} ms (Rayleigh, n = ${det.phase.n}).
            </p>
          </div>
          <div aria-hidden="true" className="shrink-0">
            <div className=${'metro grid grid-cols-8 gap-1 w-[220px] h-8 ' + (ok ? 'on' : '')}>
              ${Array.from({ length: 8 }, (_, k) => html`<span key=${k} style=${{ animationDelay: (k * 0.125) + 's' }}></span>`)}
            </div>
            <p className="mt-1.5 text-[11px] text-dim text-center">tick cadence, slowed 64×</p>
          </div>
        </div>
      </section>`;
  }

  // ---------- Scorecards ----------
  function Card({ icon, title, children, accent }) {
    return html`
      <div className="rounded-xl border border-edge bg-panel p-5 flex flex-col min-w-0">
        <div className="flex items-center gap-2 text-sm text-dim font-medium"><span style=${{ color: accent }}>${Icon(icon)}</span>${title}</div>
        <div className="mt-3 flex-1">${children}</div>
      </div>`;
  }
  function Scorecards({ det, sum, meta }) {
    return html`
      <section className="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
        <${Card} icon="Radio" title="64 Hz tick synchronization" accent=${det.confirmed ? COLORS.ok : COLORS.gw}>
          <p className=${'font-display text-3xl font-bold ' + (det.confirmed ? 'glow-ok' : 'text-wait')}>${det.confirmed ? 'Confirmed' : 'Inconclusive'}</p>
          <p className="mt-1 num text-sm text-dim">${isFinite(det.rhythmHz) ? f1(det.rhythmHz) + ' Hz detected rhythm' : 'no stable rhythm'}</p>
          <p className="mt-3 text-xs text-dim num">${det.ticks.length} tick-aligned spikes · ${det.harmonic} skipped-tick intervals (2–4×)</p>
        <//>
        <${Card} icon="Hourglass" title="GPU starvation surge" accent=${COLORS.gw}>
          <p className="font-display text-3xl font-bold text-wait num">${isFinite(sum.surgePct) ? (sum.surgePct >= 0 ? '+' : '') + f0(sum.surgePct) + '%' : '—'}</p>
          <p className="mt-1 text-sm text-dim">GPU wait at tick vs. baseline frames</p>
          <p className="mt-3 text-xs text-dim num">${f2(sum.gwTick)} ms at tick · ${f2(sum.gwBase)} ms baseline</p>
        <//>
        <${Card} icon="Gauge" title="Render capacity vs. real framerate" accent=${COLORS.gb}>
          <div className="grid grid-cols-2 gap-3">
            <div><p className="font-display text-3xl font-bold text-busy num">${f0(sum.gpuPotentialFps)}</p><p className="text-xs text-dim mt-1">Unconstrained GPU potential (FPS)</p></div>
            <div><p className="font-display text-3xl font-bold text-frame num">${f0(sum.tickFps)}</p><p className="text-xs text-dim mt-1">Bottlenecked FPS at tick (worst)</p></div>
          </div>
          <p className="mt-3 text-xs text-dim num">avg ${f0(sum.avgFps)} FPS · 1% low ${f0(sum.low1)} FPS</p>
        <//>
        <${Card} icon="Cpu" title="Hardware profile" accent=${COLORS.tick}>
          <dl className="grid grid-cols-2 gap-x-3 gap-y-2 text-sm num">
            <div><dt className="text-xs text-dim">CPU clock</dt><dd className="font-semibold">${isFinite(sum.cpuMHz) ? f0(sum.cpuMHz) + ' MHz' : 'n/a'}</dd></div>
            <div><dt className="text-xs text-dim">CPU load</dt><dd className="font-semibold">${isFinite(sum.cpu) ? f1(sum.cpu) + '%' : 'n/a'}</dd></div>
            <div><dt className="text-xs text-dim">GPU load</dt><dd className="font-semibold">${isFinite(sum.gpu) ? f1(sum.gpu) + '%' : 'n/a'}</dd></div>
            <div><dt className="text-xs text-dim">GPU memory</dt><dd className="font-semibold">${isFinite(sum.gpuMem) ? (sum.gpuMem / 1e9).toFixed(1) + (isFinite(sum.gpuMemSize) ? ' / ' + (sum.gpuMemSize / 1e9).toFixed(0) : '') + ' GB' : 'n/a'}</dd></div>
          </dl>
          <p className="mt-3 text-xs text-dim num">${meta.app || 'cs2.exe'} · ${f0(sum.frames)} frames · ${f1(sum.duration)} s</p>
        <//>
      </section>`;
  }

  // ---------- Chart ----------
  function decimate(frames, maxPts = 2400) {
    if (frames.length <= maxPts) return frames;
    const size = Math.ceil(frames.length / maxPts), out = [];
    for (let i = 0; i < frames.length; i += size) {
      let best = frames[i];
      for (let j = i + 1; j < Math.min(i + size, frames.length); j++) if (frames[j].ft > best.ft) best = frames[j];
      out.push(best);
    }
    return out;
  }

  function ChartTip({ active, payload }) {
    if (!active || !payload || !payload.length) return null;
    const p = payload[0].payload;
    const row = (c, label, v) => html`<div className="flex justify-between gap-6"><span style=${{ color: c }}>${label}</span><span className="num font-semibold">${f2(v)} ms</span></div>`;
    return html`
      <div className="rounded-lg border border-edge bg-void/95 px-3 py-2.5 text-xs shadow-xl min-w-[190px]">
        <div className="num text-dim mb-1.5">${p.t.toFixed(4)} s · ${f1(p.tm)} ms</div>
        ${row(COLORS.ft, 'Frametime', p.ft)}
        ${row(COLORS.gw, 'GPU wait', p.gw)}
        ${row(COLORS.gb, 'GPU busy', p.gb)}
        ${row('#D4D4D8', 'CPU busy', p.cb)}
      </div>`;
  }

  const SERIES = [
    { key: 'ft', label: 'Frametime (MsBetweenPresents)', color: COLORS.ft },
    { key: 'gw', label: 'GPU Wait (MsGPUWait)', color: COLORS.gw },
    { key: 'gb', label: 'GPU Busy (MsGPUBusy)', color: COLORS.gb },
    { key: 'tick', label: '64 Hz Tick Guides', color: COLORS.tick },
  ];

  function ChartPanel({ frames, det, best, range, setRange, preset, setPreset, show, setShow, exportRef, sum, fileName, onShare }) {
    const [sel, setSel] = useState(null);
    const total = frames[frames.length - 1].t;
    const [a, b] = range;
    const view = useMemo(() => {
      let lo = 0, hi = frames.length;
      while (lo < frames.length && frames[lo].t < a) lo++;
      hi = lo; while (hi < frames.length && frames[hi].t <= b) hi++;
      return decimate(frames.slice(Math.max(0, lo - 1), Math.min(frames.length, hi + 1)));
    }, [frames, a, b]);
    const tickLines = useMemo(() => det.ticks.filter(e => e.tm / 1000 >= a && e.tm / 1000 <= b), [det, a, b]);
    const tooMany = tickLines.length > 300;
    const yMax = useMemo(() => {
      let m = 0; for (const f of view) m = Math.max(m, show.ft ? f.ft : 0, show.gw ? f.gw || 0 : 0, show.gb ? f.gb || 0 : 0);
      return Math.ceil(Math.min(m, E.median(view.map(f => f.ft)) * 12) + 0.5);
    }, [view, show]);

    const presets = [
      { id: 'best', label: '🎯 Best Evidence Window', r: best ? [best.start, best.end] : null },
      { id: 'first', label: 'First 500ms', r: [0, Math.min(0.5, total)] },
      { id: 'full', label: 'Full Benchmark', r: [0, total] },
    ];
    const span = b - a;
    const zoom = factor => {
      const c = (a + b) / 2, h = Math.max(0.05, Math.min(total, span * factor)) / 2;
      let na = Math.max(0, c - h), nb = Math.min(total, c + h);
      setRange([na, nb]); setPreset(null);
    };
    const step = Math.max(total / 2000, 0.001);

    return html`
      <section className="rounded-xl border border-edge bg-panel">
        <div className="flex flex-wrap items-center gap-2 p-4 border-b border-edge">
          ${presets.map(p => html`<button key=${p.id} type="button" disabled=${!p.r}
              onClick=${() => { setRange(p.r); setPreset(p.id); }}
              className=${'h-8 rounded-md px-3 text-sm font-semibold border transition-colors disabled:opacity-40 ' + (preset === p.id ? 'border-tick bg-tick/15 text-ink' : 'border-edge text-dim hover:text-ink')}>${p.label}</button>`)}
          <div className="ml-auto flex items-center gap-1">
            <button type="button" onClick=${onShare} className="mr-2 inline-flex items-center gap-2 h-8 rounded-md px-3 text-sm font-semibold border border-tick/60 bg-tick/15 text-ink hover:bg-tick/25">${Icon('Share2', { size: 15 })} Export Card</button>
            <button type="button" aria-label="Zoom in" onClick=${() => zoom(0.5)} className="h-8 w-8 grid place-items-center rounded-md border border-edge text-dim hover:text-ink">${Icon('ZoomIn')}</button>
            <button type="button" aria-label="Zoom out" onClick=${() => zoom(2)} className="h-8 w-8 grid place-items-center rounded-md border border-edge text-dim hover:text-ink">${Icon('ZoomOut')}</button>
          </div>
        </div>

        <div ref=${exportRef} className="p-4 sm:p-5 bg-void rounded-b-xl">
          <div className="flex flex-wrap items-start justify-between gap-3 mb-3">
            <div className="min-w-0">
              <h2 className="font-display text-lg font-bold">Frame pacing trace <span className="text-dim font-medium text-sm num">${a.toFixed(3)}s – ${b.toFixed(3)}s</span></h2>
              <p className="text-xs text-dim mt-0.5 truncate">${fileName}</p>
            </div>
            <div className="flex flex-wrap gap-2">
              ${preset === 'best' && best && html`<span className="inline-flex items-center gap-1.5 rounded-full border border-ok/50 bg-ok/10 px-3 py-1 text-xs font-semibold text-ok num">${Icon('Crosshair', { size: 13 })} Best Sample Window Selected (Seconds ${best.start.toFixed(2)}s - ${best.end.toFixed(2)}s)</span>`}
              <span className=${'inline-flex items-center rounded-full border px-3 py-1 text-xs font-semibold ' + (det.confirmed ? 'border-ok/50 text-ok' : 'border-wait/50 text-wait')}>
                ${det.confirmed ? `64 Hz aligned · ${f1(det.rhythmHz)} Hz` : 'Tick pattern irregular'}</span>
            </div>
          </div>

          <div className="flex flex-wrap gap-2 mb-3" role="group" aria-label="Series visibility">
            ${SERIES.map(s => html`<button key=${s.key} type="button" aria-pressed=${show[s.key]}
                onClick=${() => setShow({ ...show, [s.key]: !show[s.key] })}
                className=${'inline-flex items-center gap-2 h-8 rounded-full border px-3 text-xs font-semibold transition-opacity ' + (show[s.key] ? 'opacity-100' : 'opacity-40')}
                style=${{ borderColor: s.color + '99', background: show[s.key] ? s.color + '1f' : 'transparent' }}>
                <span className="inline-block w-3 h-3 rounded-sm border" style=${{ borderColor: s.color, background: show[s.key] ? s.color : 'transparent', borderStyle: s.key === 'tick' ? 'dashed' : 'solid' }}></span>
                ${s.label}</button>`)}
          </div>

          <div className="h-[340px] sm:h-[420px] select-none">
            <${ResponsiveContainer} width="100%" height="100%">
              <${LineChart} data=${view} margin=${{ top: 8, right: 12, bottom: 4, left: -8 }}
                onMouseDown=${e => e && e.activeLabel != null && setSel({ x1: e.activeLabel, x2: e.activeLabel })}
                onMouseMove=${e => sel && e && e.activeLabel != null && setSel({ ...sel, x2: e.activeLabel })}
                onMouseUp=${() => {
                  if (sel && Math.abs(sel.x2 - sel.x1) > 0.002) { setRange([Math.min(sel.x1, sel.x2), Math.max(sel.x1, sel.x2)]); setPreset(null); }
                  setSel(null);
                }}>
                <${CartesianGrid} stroke="#1E1E26" strokeDasharray="0" />
                <${XAxis} dataKey="t" type="number" domain=${[a, b]} allowDataOverflow=${true} tickFormatter=${v => span < 2 ? v.toFixed(3) : v.toFixed(1)}
                  stroke="#52525B" tick=${{ fill: '#8E8E9A', fontSize: 11 }} tickCount=${8} unit="s" />
                <${YAxis} domain=${[0, yMax]} allowDataOverflow=${true} stroke="#52525B" tick=${{ fill: '#8E8E9A', fontSize: 11 }} unit=" ms" width=${56} />
                <${Tooltip} content=${html`<${ChartTip} />`} cursor=${{ stroke: '#3F3F46' }} isAnimationActive=${false} />
                ${show.tick && !tooMany && tickLines.map(e => html`<${ReferenceLine} key=${'t' + e.i} x=${e.tm / 1000} stroke=${COLORS.tick} strokeDasharray="3 3" strokeOpacity=${0.7} ifOverflow="hidden" />`)}
                ${show.gb && html`<${Line} type="linear" dataKey="gb" stroke=${COLORS.gb} strokeWidth=${2} dot=${false} isAnimationActive=${false} connectNulls=${true} />`}
                ${show.gw && html`<${Line} type="linear" dataKey="gw" stroke=${COLORS.gw} strokeWidth=${2} dot=${false} isAnimationActive=${false} connectNulls=${true} />`}
                ${show.ft && html`<${Line} type="linear" dataKey="ft" stroke=${COLORS.ft} strokeWidth=${2} dot=${false} isAnimationActive=${false} />`}
                ${sel && html`<${ReferenceArea} x1=${sel.x1} x2=${sel.x2} fill=${COLORS.tick} fillOpacity=${0.12} stroke=${COLORS.tick} strokeOpacity=${0.5} />`}
              <//>
            <//>
          </div>

          <div className="mt-3 flex flex-col md:flex-row md:items-center gap-2 md:gap-6 text-xs">
            <p className="flex items-start gap-2 text-ink/90">
              <span className="text-wait mt-px">${Icon('Info', { size: 14 })}</span>
              <span>Notice: MsGPUBusy remains flat while MsGPUWait duplicates Frametime spikes.</span>
            </p>
            <p className="text-dim num md:ml-auto">
              r(frametime, GPU wait) = ${f2(sum.rFtGw)} · r(frametime, GPU busy) = ${f2(sum.rFtGb)}
              ${tooMany && show.tick ? ` · ${tickLines.length} ticks in view — zoom in to draw guides` : ''}
            </p>
          </div>
        </div>

        <div className="px-4 sm:px-5 pb-5 pt-3 border-t border-edge">
          <div className="flex justify-between text-xs text-dim num mb-1">
            <span>${a.toFixed(3)} s</span><span>drag on the chart to zoom into a region</span><span>${b.toFixed(3)} s</span>
          </div>
          <div className="dual">
            <div className="absolute top-1/2 -translate-y-1/2 h-1.5 w-full rounded-full bg-raised"></div>
            <div className="absolute top-1/2 -translate-y-1/2 h-1.5 rounded-full bg-tick/60" style=${{ left: (a / total * 100) + '%', width: ((b - a) / total * 100) + '%' }}></div>
            <input type="range" aria-label="Range start" min="0" max=${total} step=${step} value=${a}
              onChange=${e => { const v = Math.min(+e.target.value, b - step * 5); setRange([Math.max(0, v), b]); setPreset(null); }} />
            <input type="range" aria-label="Range end" min="0" max=${total} step=${step} value=${b}
              onChange=${e => { const v = Math.max(+e.target.value, a + step * 5); setRange([a, Math.min(total, v)]); setPreset(null); }} />
          </div>
        </div>
      </section>`;
  }

  // ---------- Interval histogram ----------
  function IntervalHistogram({ det }) {
    const data = useMemo(() => {
      const bins = []; for (let x = 0; x < 50; x += 0.5) bins.push({ x, n: 0 });
      det.intervals.forEach(d => { const k = Math.floor(d / 0.5); if (k >= 0 && k < bins.length) bins[k].n++; });
      return bins.map(bn => ({ ...bn, label: (bn.x + 0.25).toFixed(2), band: bn.x + 0.5 > E.BAND[0] && bn.x < E.BAND[1] }));
    }, [det]);
    return html`
      <section className="rounded-xl border border-edge bg-panel p-5">
        <div className="flex flex-wrap items-baseline justify-between gap-2">
          <h2 className="font-display text-lg font-bold">Spike-to-spike interval distribution</h2>
          <p className="text-xs text-dim num">${det.intervals.length} intervals · 0.5 ms bins · green = 14.1–17.1 ms band</p>
        </div>
        <div className="h-[220px] mt-3">
          <${ResponsiveContainer} width="100%" height="100%">
            <${BarChart} data=${data} margin=${{ top: 4, right: 8, bottom: 0, left: -18 }}>
              <${CartesianGrid} stroke="#1E1E26" vertical=${false} />
              <${XAxis} dataKey="x" type="number" domain=${[0, 50]} ticks=${[0, 15.625, 31.25, 46.875]} tickFormatter=${v => v ? v.toFixed(1) + ' ms' : '0'} stroke="#52525B" tick=${{ fill: '#8E8E9A', fontSize: 11 }} />
              <${YAxis} stroke="#52525B" tick=${{ fill: '#8E8E9A', fontSize: 11 }} allowDecimals=${false} />
              <${Tooltip} cursor=${{ fill: 'rgba(167,139,250,.08)' }} isAnimationActive=${false}
                content=${({ active, payload }) => active && payload && payload.length ? html`<div className="rounded-md border border-edge bg-void px-2.5 py-1.5 text-xs num">${payload[0].payload.x.toFixed(1)}–${(payload[0].payload.x + 0.5).toFixed(1)} ms: <b>${payload[0].payload.n}</b></div>` : null} />
              <${Bar} dataKey="n" isAnimationActive=${false} barSize=${6}>
                ${data.map((d, k) => html`<${Cell} key=${k} fill=${d.band ? COLORS.ok : '#3F3F4A'} />`)}
              <//>
            <//>
          <//>
        </div>
      </section>`;
  }

  // ---------- Method notes ----------
  function Method({ det, best, meta }) {
    return html`
      <details className="rounded-xl border border-edge bg-panel p-5 group">
        <summary className="cursor-pointer font-display font-bold flex items-center gap-2">${Icon('FlaskConical')} How these numbers are computed</summary>
        <div className="mt-4 grid gap-4 md:grid-cols-2 text-sm text-dim leading-relaxed max-w-none">
          <p><b className="text-ink">Spike detection.</b> A frame counts as a spike when it is a local maximum of MsBetweenPresents above ${f2(det.ftThr)} ms (max of 3.8 ms and 1.4× the ${f2(det.medFt)} ms median) or of MsGPUWait above ${f2(det.gwThr)} ms. Spikes within 3 ms merge into one event.</p>
          <p><b className="text-ink">Cadence test.</b> Intervals between consecutive events are compared with 15.625 ms ± 1.5 ms. Alignment is confirmed when at least 35% match. The p-value comes from a Rayleigh phase-locking test scanned across 15.3–16.0 ms and corrected for the number of periods tried, so it reflects this capture rather than a fixed claim.</p>
          <p><b className="text-ink">Best evidence window.</b> A 350 ms window slides in 50 ms steps. Each window scores (aligned MsGPUWait peaks) × (mean peak height) ÷ (MsGPUBusy std-dev), with peaks above window mean + 1.2σ and a strict 14.2–16.9 ms band. ${best ? `Winner: ${best.start.toFixed(2)}–${best.end.toFixed(2)} s, ${best.aligned} aligned pairs, score ${best.score.toFixed(1)}.` : 'No window had two or more aligned peaks.'}</p>
          <p><b className="text-ink">Caveats.</b> The best window is chosen to show the pattern most clearly, so judge the global percentage and histogram for how typical it is. Time base: ${meta.timeSource}.${meta.derivedWait ? ' MsGPUWait was missing and was derived as frametime − GPU busy.' : ''}${meta.hasGpu ? '' : ' No GPU busy column was present; GPU metrics are unavailable.'}</p>
        </div>
      </details>`;
  }

  // ---------- Report text ----------
  function buildReport({ det, sum, best, meta, fileName }) {
    const lines = [];
    lines.push('## CS2 Subtick / GPU Starvation Diagnostic');
    lines.push('');
    lines.push(`**Capture:** \`${fileName}\` · ${f1(sum.duration)} s · ${f0(sum.frames)} frames · avg ${f0(sum.avgFps)} FPS (1% low ${f0(sum.low1)})`);
    lines.push('');
    if (det.confirmed) {
      lines.push(`**✅ 64 Hz tick alignment confirmed (${fp(det.phase.pValue)})** — ${f1(det.pct * 100)}% of frametime/GPU-wait spike intervals (${det.matchedCount}/${det.intervals.length}) land within 15.625 ± 1.5 ms. Mean tick interval **${f2(det.meanInterval)} ms → ${f1(det.rhythmHz)} Hz**.`);
    } else {
      lines.push(`**⚠️ Tick pattern inconclusive** — only ${f1(det.pct * 100)}% of spike intervals (${det.matchedCount}/${det.intervals.length}) match the 15.625 ms cadence (threshold 35%).`);
    }
    lines.push('');
    lines.push(`**GPU starvation:** MsGPUWait averages **${f2(sum.gwTick)} ms on tick spikes vs ${f2(sum.gwBase)} ms baseline (${sum.surgePct >= 0 ? '+' : ''}${f0(sum.surgePct)}%)**, while MsGPUBusy stays at ~${f2(sum.gbTick)} ms vs ${f2(sum.gbBaseline)} ms. Correlation with frametime: GPU wait r = ${f2(sum.rFtGw)}, GPU busy r = ${f2(sum.rFtGb)}.`);
    lines.push('');
    lines.push(`**Render capacity:** the GPU could sustain ~**${f0(sum.gpuPotentialFps)} FPS** (1000 / avg MsGPUBusy), but the worst tick frame drops to **${f0(sum.tickFps)} FPS** (${f2(sum.maxTickFt)} ms).`);
    if (best) { lines.push(''); lines.push(`**Best evidence window:** ${best.start.toFixed(2)}–${best.end.toFixed(2)} s (${best.aligned} consecutive GPU-wait peaks at 64 Hz spacing).`); }
    const hw = [];
    if (isFinite(sum.cpuMHz)) hw.push(`CPU ${f0(sum.cpuMHz)} MHz`);
    if (isFinite(sum.cpu)) hw.push(`CPU load ${f1(sum.cpu)}%`);
    if (isFinite(sum.gpu)) hw.push(`GPU load ${f1(sum.gpu)}%`);
    if (hw.length) { lines.push(''); lines.push(`**System:** ${hw.join(' · ')}`); }
    lines.push('');
    lines.push('_Interpretation: frametime spikes recur at the 64 Hz simulation tick while the GPU has idle time, i.e. the render thread is waiting on CPU/tick work rather than being GPU-bound._');
    lines.push('');
    lines.push('_Analysed locally from an Intel PresentMon capture._');
    return lines.join('\n');
  }

  // ---------- App ----------
  function App() {
    const [data, setData] = useState(null);
    const [busy, setBusy] = useState(false);
    const [error, setError] = useState('');
    const [range, setRange] = useState([0, 0.5]);
    const [preset, setPreset] = useState('best');
    const [show, setShow] = useState({ ft: true, gw: true, gb: true, tick: true });
    const [toast, setToast] = useState('');
    const [fallbackText, setFallbackText] = useState('');
    const [shareOpen, setShareOpen] = useState(false);
    const exportRef = useRef(null);

    useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(''), 3200); return () => clearTimeout(id); }, [toast]);

    const ingest = useCallback((rows, fields, fileName) => {
      try {
        const cols = E.mapColumns(fields);
        const built = E.buildFrames(rows, cols);
        const det = E.detectTicks(built.frames);
        const best = E.bestWindow(built.frames);
        const sum = E.summarise(built.frames, det);
        const app = rows[0] && cols.app ? rows[0][cols.app] : '';
        setData({ ...built, det, best, sum, cols, fileName, meta: { app, timeSource: built.timeSource, derivedWait: built.derivedWait, hasGpu: built.hasGpu } });
        const total = built.frames[built.frames.length - 1].t;
        if (best) { setRange([best.start, best.end]); setPreset('best'); }
        else { setRange([0, Math.min(0.5, total)]); setPreset('first'); }
        setError('');
      } catch (e) { setError(e.message || String(e)); setData(null); }
      setBusy(false);
    }, []);

    const onFile = useCallback(file => {
      setBusy(true); setError('');
      const rows = []; let fields = [];
      Papa.parse(file, {
        header: true, dynamicTyping: true, skipEmptyLines: true,
        chunk: res => { if (!fields.length) fields = res.meta.fields || []; for (const r of res.data) rows.push(r); },
        complete: () => ingest(rows, fields, file.name),
        error: err => { setError('Could not read the file: ' + err.message); setBusy(false); },
      });
    }, [ingest]);

    const onDemo = useCallback(() => {
      setBusy(true);
      setTimeout(() => {
        const rows = E.makeDemoRows();
        // Round-trip through CSV so the demo exercises the same parser path as a real capture
        const csv = Papa.unparse(rows);
        const parsed = Papa.parse(csv, { header: true, dynamicTyping: true, skipEmptyLines: true });
        ingest(parsed.data, parsed.meta.fields, 'pmcap-cs2.exe-DEMO-synthetic.csv');
      }, 30);
    }, [ingest]);

    const copyReport = async () => {
      const text = buildReport(data);
      try { await navigator.clipboard.writeText(text); setToast('Summary copied'); }
      catch (_) {
        const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
        ta.remove();
        if (ok) setToast('Summary copied'); else setFallbackText(text);
      }
    };

    const exportPng = async () => {
      const node = exportRef.current; if (!node) return;
      setToast('Rendering PNG…');
      try {
        const w = node.offsetWidth;
        const blob = await htmlToImage.toBlob(node, { pixelRatio: 1920 / w, backgroundColor: '#09090B', fontEmbedCSS: '', cacheBust: false });
        const name = 'cs2-tick-evidence-' + range[0].toFixed(2) + 's.png';
        let dl = null;
        try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (_) {}
        if (dl) {
          try { await dl.save({ filename: name, data: blob }); setToast('PNG exported'); }
          catch (e) { setToast(e && e.code === 'declined' ? 'Export cancelled' : 'Export unavailable here'); }
        } else {
          const url = URL.createObjectURL(blob); const aEl = document.createElement('a');
          aEl.href = url; aEl.download = name; document.body.appendChild(aEl); aEl.click(); aEl.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000); setToast('PNG exported');
        }
      } catch (e) { setToast('Could not render PNG: ' + (e.message || e)); }
    };

    return html`
      <div className="min-h-screen">
        <header className="sticky z-30 border-b border-edge bg-void/85 backdrop-blur" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
          <div className="mx-auto max-w-[1400px] px-4 sm:px-6 h-14 flex items-center gap-3">
            <div className="flex items-center gap-2.5 min-w-0">
              <span className="grid place-items-center w-8 h-8 rounded-md border border-tick/50 text-tick">${Icon('Activity', { size: 18 })}</span>
              <span className="font-display font-bold tracking-tight truncate">CS2 Subtick <span className="text-dim font-medium">& GPU Starvation Diagnostic</span></span>
            </div>
            ${data && html`<div className="ml-auto flex items-center gap-2">
              <${Btn} onClick=${() => setData(null)} title="Load another capture">${Icon('FolderOpen')}<span className="hidden md:inline">New capture</span><//>
              <${Btn} onClick=${copyReport}>${Icon('ClipboardCopy')}<span className="hidden sm:inline">Copy Summary for Reddit / X</span><//>
              <${Btn} variant="primary" onClick=${() => setShareOpen(true)}>${Icon('Share2')}<span className="hidden lg:inline">Export Card</span><//>
            </div>`}
          </div>
        </header>

        ${!data
          ? html`<${DropZone} onFile=${onFile} onDemo=${onDemo} busy=${busy} error=${error} />`
          : html`<main className="mx-auto max-w-[1400px] px-4 sm:px-6 py-6 flex flex-col gap-5">
              ${data.fileName.includes('DEMO') && html`<p className="text-xs text-dim flex items-center gap-2">${Icon('FlaskConical', { size: 14 })} Showing synthetic demo data generated in the browser. Drop your own capture to analyse real frames.</p>`}
              <${Verdict} det=${data.det} />
              <${Scorecards} det=${data.det} sum=${data.sum} meta=${data.meta} />
              <${ChartPanel} frames=${data.frames} det=${data.det} best=${data.best} range=${range} setRange=${setRange}
                preset=${preset} setPreset=${setPreset} show=${show} setShow=${setShow} exportRef=${exportRef} sum=${data.sum} fileName=${data.fileName} onShare=${() => setShareOpen(true)} />
              <${IntervalHistogram} det=${data.det} />
              <${Method} det=${data.det} best=${data.best} meta=${data.meta} />
            </main>`}

        ${shareOpen && data && window.ShareCardKit && html`<${window.ShareCardKit.ShareModal} data=${data} viewRange=${range} onClose=${() => setShareOpen(false)} toast=${setToast} />`}

        ${fallbackText && html`<div className="fixed inset-0 z-50 bg-black/70 grid place-items-center p-4" onClick=${() => setFallbackText('')}>
          <div className="w-full max-w-2xl rounded-xl border border-edge bg-panel p-5" onClick=${e => e.stopPropagation()}>
            <p className="font-display font-bold mb-2">Copy the summary</p>
            <p className="text-sm text-dim mb-3">Clipboard access is blocked here. Select the text below and copy it.</p>
            <textarea readOnly value=${fallbackText} className="w-full h-72 rounded-md border border-edge bg-void p-3 text-xs text-ink" onFocus=${e => e.target.select()} autoFocus></textarea>
            <div className="mt-3 flex justify-end"><${Btn} onClick=${() => setFallbackText('')}>Close<//></div>
          </div></div>`}

        ${toast && html`<div role="status" className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] rounded-lg border border-edge bg-raised px-4 py-2.5 text-sm shadow-2xl" style=${{ marginBottom: 'env(safe-area-inset-bottom, 0px)' }}>${toast}</div>`}
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
